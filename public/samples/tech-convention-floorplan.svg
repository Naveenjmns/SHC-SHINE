<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background-color: #0b0a0a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Dark blueprint grid pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="800" fill="#0b0a0a" />
  <rect width="1000" height="800" fill="url(#grid-pattern)" />

  <!-- Outer Walls & Blueprint Frame -->
  <rect x="50" y="50" width="900" height="700" rx="16" fill="#111827" stroke="#374151" stroke-width="6" />

  <!-- Corridors / Hallway Paths -->
  <path d="M 500 700 L 500 450 L 220 450 L 220 200" fill="none" stroke="#1f2937" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 500 450 L 780 450 L 780 200" fill="none" stroke="#1f2937" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 500 450 L 500 220" fill="none" stroke="#1f2937" stroke-width="48" stroke-linecap="round" />

  <!-- Walking Guide Dotted Lines -->
  <path d="M 500 700 L 500 450 L 220 450 L 220 200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.4" />
  <path d="M 500 450 L 780 450 L 780 200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.4" />
  <path d="M 500 450 L 500 220" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.4" />

  <!-- ==================== ROOMS & COMPETITION ZONES ==================== -->

  <!-- Main Arena (Keynote, On-Stage Competitions) -->
  <g class="zone-group">
    <rect id="main-arena" x="380" y="80" width="240" height="150" rx="12" fill="#1e3a34" stroke="#34d399" stroke-width="3" />
    <text x="500" y="150" fill="#a7f3d0" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">MAIN ARENA</text>
    <text x="500" y="172" fill="#6ee7b7" font-size="11" text-anchor="middle">Keynote & Cultural Stage</text>
  </g>

  <!-- Coding Lab 1 (Web Design, Hackathon) -->
  <g class="zone-group">
    <rect id="coding-lab-1" x="90" y="80" width="220" height="140" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="3" />
    <text x="200" y="145" fill="#cffafe" font-size="15" font-weight="800" text-anchor="middle">CODING LAB 1</text>
    <text x="200" y="165" fill="#67e8f9" font-size="10" text-anchor="middle">Software & Web Development</text>
  </g>

  <!-- Coding Lab 2 (Debugging, Code Sprint) -->
  <g class="zone-group">
    <rect id="coding-lab-2" x="90" y="270" width="220" height="140" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="3" />
    <text x="200" y="335" fill="#cffafe" font-size="15" font-weight="800" text-anchor="middle">CODING LAB 2</text>
    <text x="200" y="355" fill="#67e8f9" font-size="10" text-anchor="middle">Algorithms & Debugging</text>
  </g>

  <!-- Gaming Lounge (E-Sports, LAN Tournament) -->
  <g class="zone-group">
    <rect id="gaming-lounge" x="690" y="80" width="220" height="140" rx="10" fill="#4c1d95" stroke="#a855f7" stroke-width="3" />
    <text x="800" y="145" fill="#f3e8ff" font-size="15" font-weight="800" text-anchor="middle">GAMING LOUNGE</text>
    <text x="800" y="165" fill="#d8b4fe" font-size="10" text-anchor="middle">E-Sports & LAN Arena</text>
  </g>

  <!-- Seminar Hall (Paper Presentation, Quiz) -->
  <g class="zone-group">
    <rect id="seminar-hall" x="690" y="270" width="220" height="140" rx="10" fill="#713f12" stroke="#eab308" stroke-width="3" />
    <text x="800" y="335" fill="#fef9c3" font-size="15" font-weight="800" text-anchor="middle">SEMINAR HALL</text>
    <text x="800" y="355" fill="#fde047" font-size="10" text-anchor="middle">Technical Paper Presentation</text>
  </g>

  <!-- Cafeteria & Food Court -->
  <g class="zone-group">
    <rect id="cafeteria" x="90" y="520" width="250" height="180" rx="12" fill="#431407" stroke="#f97316" stroke-width="3" />
    <text x="215" y="605" fill="#ffedd5" font-size="16" font-weight="800" text-anchor="middle">CAFETERIA</text>
    <text x="215" y="628" fill="#fdba74" font-size="11" text-anchor="middle">Food Court & Refreshments</text>
  </g>

  <!-- Expo / Career Stalls -->
  <g class="zone-group">
    <rect id="expo-booths" x="660" y="520" width="250" height="180" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="3" />
    <text x="785" y="605" fill="#dcfce7" font-size="16" font-weight="800" text-anchor="middle">EXPO & BOOTHS</text>
    <text x="785" y="628" fill="#86efac" font-size="11" text-anchor="middle">Career Stalls & Projects</text>
  </g>

  <!-- ==================== AMENITIES ==================== -->
  <g id="amenities">
    <!-- Restrooms -->
    <g id="amenity-restroom-1">
      <circle cx="350" cy="450" r="14" fill="#a855f7" />
      <text x="350" y="454" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">WC</text>
    </g>

    <!-- Water Cooler -->
    <g id="amenity-water-1">
      <circle cx="650" cy="450" r="14" fill="#06b6d4" />
      <text x="650" y="454" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">H2O</text>
    </g>

    <!-- Helpdesk / Security -->
    <g id="amenity-helpdesk-1">
      <circle cx="430" cy="650" r="14" fill="#10b981" />
      <text x="430" y="654" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">INFO</text>
    </g>
  </g>

  <!-- ==================== NAVIGATION WAYPOINTS ==================== -->
  <g id="waypoints" opacity="0.95">
    <circle id="wp-entrance" cx="500" cy="700" r="6" fill="#ef4444" />
    <circle id="wp-central-hub" cx="500" cy="450" r="6" fill="#38bdf8" />
    <circle id="wp-west-hub" cx="220" cy="450" r="6" fill="#38bdf8" />
    <circle id="wp-east-hub" cx="780" cy="450" r="6" fill="#38bdf8" />

    <circle id="wp-main-arena" cx="500" cy="240" r="6" fill="#22c55e" />
    <circle id="wp-coding-1" cx="200" cy="230" r="6" fill="#22c55e" />
    <circle id="wp-coding-2" cx="320" cy="340" r="6" fill="#22c55e" />
    <circle id="wp-gaming" cx="800" cy="230" r="6" fill="#22c55e" />
    <circle id="wp-seminar" cx="680" cy="340" r="6" fill="#22c55e" />
    <circle id="wp-cafeteria" cx="350" cy="610" r="6" fill="#f97316" />
    <circle id="wp-expo" cx="650" cy="610" r="6" fill="#22c55e" />
  </g>
</svg>

