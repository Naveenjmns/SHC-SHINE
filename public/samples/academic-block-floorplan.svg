<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background-color: #0b0a0a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="campus-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#0b0a0a" />
  <rect width="1000" height="800" fill="url(#campus-grid)" />

  <!-- Outer Walls / Campus Courtyard Layout -->
  <path d="M 100 100 L 900 100 L 900 700 L 100 700 Z" fill="#131722" stroke="#334155" stroke-width="6" />

  <!-- Central Quadrangle / Courtyard Open Space -->
  <rect x="360" y="280" width="280" height="240" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="3" stroke-dasharray="8,6" />
  <text x="500" y="405" fill="#475569" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">OPEN QUADRANGLE</text>

  <!-- Corridors surrounding the Quadrangle -->
  <rect x="310" y="230" width="380" height="340" rx="20" fill="none" stroke="#1e293b" stroke-width="40" />
  <!-- Corridor Walkway Line -->
  <rect x="310" y="230" width="380" height="340" rx="20" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.4" />

  <!-- Entrance Walkway -->
  <path d="M 500 750 L 500 580" fill="none" stroke="#1e293b" stroke-width="40" stroke-linecap="round" />
  <path d="M 500 750 L 500 580" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.4" />

  <!-- ==================== ROOMS & ARENAS ==================== -->

  <!-- Diamond Jubilee Auditorium (North Wing) -->
  <g class="zone-group">
    <rect id="auditorium" x="250" y="115" width="500" height="100" rx="10" fill="#1e3a34" stroke="#34d399" stroke-width="3" />
    <text x="500" y="165" fill="#a7f3d0" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">MAIN AUDITORIUM</text>
    <text x="500" y="185" fill="#6ee7b7" font-size="11" text-anchor="middle">Diamond Jubilee Memorial Stage</text>
  </g>

  <!-- PG Computer Center (West Wing Top) -->
  <g class="zone-group">
    <rect id="pg-lab" x="115" y="120" width="160" height="200" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="3" />
    <text x="195" y="215" fill="#cffafe" font-size="14" font-weight="800" text-anchor="middle">PG AI LAB</text>
    <text x="195" y="235" fill="#67e8f9" font-size="10" text-anchor="middle">Research & Web Lab</text>
  </g>

  <!-- UG Software Lab (West Wing Bottom) -->
  <g class="zone-group">
    <rect id="ug-lab" x="115" y="380" width="160" height="200" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="3" />
    <text x="195" y="475" fill="#cffafe" font-size="14" font-weight="800" text-anchor="middle">UG LAB</text>
    <text x="195" y="495" fill="#67e8f9" font-size="10" text-anchor="middle">Software & Coding Lab</text>
  </g>

  <!-- Seminar Hall A (East Wing Top) -->
  <g class="zone-group">
    <rect id="seminar-hall-a" x="725" y="120" width="160" height="200" rx="10" fill="#713f12" stroke="#eab308" stroke-width="3" />
    <text x="805" y="215" fill="#fef9c3" font-size="14" font-weight="800" text-anchor="middle">SEMINAR HALL A</text>
    <text x="805" y="235" fill="#fde047" font-size="10" text-anchor="middle">Conference & PPT Stage</text>
  </g>

  <!-- Seminar Hall B (East Wing Bottom) -->
  <g class="zone-group">
    <rect id="seminar-hall-b" x="725" y="380" width="160" height="200" rx="10" fill="#713f12" stroke="#eab308" stroke-width="3" />
    <text x="805" y="475" fill="#fef9c3" font-size="14" font-weight="800" text-anchor="middle">SEMINAR HALL B</text>
    <text x="805" y="495" fill="#fde047" font-size="10" text-anchor="middle">Quiz & Debate Arena</text>
  </g>

  <!-- Board Room / Staff Lounge (South-West) -->
  <g class="zone-group">
    <rect id="board-room" x="150" y="605" width="220" height="80" rx="8" fill="#3b2d54" stroke="#a78bfa" stroke-width="2.5" />
    <text x="260" y="648" fill="#e9d5ff" font-size="13" font-weight="800" text-anchor="middle">BOARD ROOM</text>
    <text x="260" y="665" fill="#c084fc" font-size="9" text-anchor="middle">Judges & VIP Lounge</text>
  </g>

  <!-- Dining & Refreshments (South-East) -->
  <g class="zone-group">
    <rect id="dining-hall" x="630" y="605" width="220" height="80" rx="8" fill="#431407" stroke="#f97316" stroke-width="2.5" />
    <text x="740" y="648" fill="#ffedd5" font-size="13" font-weight="800" text-anchor="middle">DINING HALL</text>
    <text x="740" y="665" fill="#fdba74" font-size="9" text-anchor="middle">Delegate Meals & Snacks</text>
  </g>

  <!-- ==================== AMENITIES ==================== -->
  <g id="amenities">
    <g id="amenity-restroom-1">
      <circle cx="290" cy="180" r="13" fill="#a855f7" />
      <text x="290" y="184" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">WC</text>
    </g>
    <g id="amenity-water-1">
      <circle cx="290" cy="520" r="13" fill="#06b6d4" />
      <text x="290" y="524" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">H2O</text>
    </g>
    <g id="amenity-restroom-2">
      <circle cx="710" cy="180" r="13" fill="#a855f7" />
      <text x="710" y="184" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">WC</text>
    </g>
    <g id="amenity-water-2">
      <circle cx="710" cy="520" r="13" fill="#06b6d4" />
      <text x="710" y="524" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">H2O</text>
    </g>
    <g id="amenity-helpdesk-1">
      <circle cx="440" cy="620" r="13" fill="#10b981" />
      <text x="440" y="624" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">INFO</text>
    </g>
  </g>

  <!-- ==================== NAVIGATION WAYPOINTS ==================== -->
  <g id="waypoints" opacity="0.95">
    <circle id="wp-entrance" cx="500" cy="740" r="6" fill="#ef4444" />
    <circle id="wp-foyer" cx="500" cy="580" r="6" fill="#38bdf8" />
    <circle id="wp-quad-south" cx="500" cy="500" r="6" fill="#38bdf8" />
    <circle id="wp-quad-west" cx="310" cy="350" r="6" fill="#38bdf8" />
    <circle id="wp-quad-north" cx="500" cy="230" r="6" fill="#38bdf8" />
    <circle id="wp-quad-east" cx="690" cy="350" r="6" fill="#38bdf8" />

    <circle id="wp-auditorium" cx="500" cy="215" r="6" fill="#22c55e" />
    <circle id="wp-pg-lab" cx="280" cy="220" r="6" fill="#22c55e" />
    <circle id="wp-ug-lab" cx="280" cy="480" r="6" fill="#22c55e" />
    <circle id="wp-seminar-a" cx="720" cy="220" r="6" fill="#22c55e" />
    <circle id="wp-seminar-b" cx="720" cy="480" r="6" fill="#22c55e" />
    <circle id="wp-board-room" cx="370" cy="640" r="6" fill="#22c55e" />
    <circle id="wp-dining-hall" cx="630" cy="640" r="6" fill="#f97316" />
  </g>
</svg>

