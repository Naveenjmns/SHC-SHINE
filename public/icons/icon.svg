
  <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1C1917" />
        <stop offset="30%" stop-color="#FF6B1A" />
        <stop offset="70%" stop-color="#E8551F" />
        <stop offset="100%" stop-color="#D9A441" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#FEF3C7" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10.24" stdDeviation="15.36" flood-color="#FF6B1A" flood-opacity="0.4" />
      </filter>
    </defs>

    <!-- Background Base -->
    <rect width="512" height="512" fill="#FAF8F5" />

    <!-- Gradient Squircle -->
    <rect x="25.6" y="25.6" width="460.8" height="460.8" rx="112.64" fill="url(#shineGrad)" filter="url(#glow)" />

    <!-- Inner Border Ring -->
    <rect x="27.6" y="27.6" width="456.8" height="456.8" rx="110.64" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="5.12" />

    <!-- Center 'S' Wordmark Glyph -->
    <text x="235.52" y="322.56" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="225.28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-0.03em">
      S
    </text>

    <!-- '26' Accent Badge -->
    <text x="368.64" y="215.04" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="81.92" fill="#FFFFFF" text-anchor="middle">
      26
    </text>

    <!-- Sparkle Star Accent -->
    <path d="M 384 337.92 Q 384 368.64 414.72 368.64 Q 384 368.64 384 399.36 Q 384 368.64 353.28 368.64 Q 384 368.64 384 337.92 Z" fill="#FDE68A" />
  </svg>
  