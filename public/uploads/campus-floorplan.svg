<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background-color: #0b0a0a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Grid pattern for dark blueprint aesthetic -->
    <pattern id="blueprint-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
    <filter id="zone-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background blueprint grid -->
  <rect width="1000" height="800" fill="#0b0a0a" />
  <rect width="1000" height="800" fill="url(#blueprint-grid)" />

  <!-- Outer building boundary walls -->
  <path d="M 160 80 L 260 80 L 260 170 L 460 170 L 530 250 L 850 570 L 820 620 L 760 670 L 700 710 L 610 610 L 490 610 L 440 680 L 370 610 L 340 610 L 160 410 Z"
        fill="#18181c" stroke="#44403c" stroke-width="8" stroke-linejoin="round" />

  <!-- Corridors and Pathways -->
  <path d="M 420 630 L 420 500 L 420 400 L 300 400 L 210 310 L 210 120"
        fill="none" stroke="#292524" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 420 500 L 540 500 L 750 710"
        fill="none" stroke="#292524" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Corridors walking dash centerline -->
  <path d="M 420 630 L 420 500 L 420 400 L 300 400 L 210 310 L 210 120"
        fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.5" />
  <path d="M 420 500 L 540 500 L 750 710"
        fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.5" />

  <!-- ==================== ROOMS & COMPETITION ZONES ==================== -->
  
  <!-- Hall 1: Main Auditorium (Center Green) -->
  <g class="zone-group">
    <path id="hall-1"
          d="M 370 240 L 480 240 L 495 280 L 495 440 L 470 460 L 380 460 L 355 440 L 355 280 Z"
          fill="#1e3a34" stroke="#34d399" stroke-width="3" />
    <text x="425" y="340" fill="#a7f3d0" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">HALL 1</text>
    <text x="425" y="360" fill="#6ee7b7" font-size="11" text-anchor="middle">Main Auditorium</text>
  </g>

  <!-- Hall 2: Octagon Arena (Lower Right Green) -->
  <g class="zone-group">
    <polygon id="hall-2"
             points="670,470 730,470 770,510 770,570 730,610 670,610 630,570 630,510"
             fill="#1e3a34" stroke="#34d399" stroke-width="3" />
    <text x="700" y="535" fill="#a7f3d0" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1">HALL 2</text>
    <text x="700" y="555" fill="#6ee7b7" font-size="10" text-anchor="middle">Seminar Hall A</text>
  </g>

  <!-- Hall 3: Computer Center (Far Right Cyan) -->
  <g class="zone-group">
    <rect id="hall-3"
          x="735" y="550" width="100" height="90" rx="8"
          transform="rotate(45 785 595)"
          fill="#164e63" stroke="#22d3ee" stroke-width="3" />
    <text x="785" y="595" fill="#cffafe" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">HALL 3</text>
    <text x="785" y="612" fill="#67e8f9" font-size="10" text-anchor="middle">MCA Lab 1</text>
  </g>

  <!-- Hall 4: Conference Room (Purple, Left of Center) -->
  <g class="zone-group">
    <polygon id="hall-4"
             points="330,480 395,480 395,570 340,570 320,530"
             fill="#3b2d54" stroke="#a78bfa" stroke-width="3" />
    <text x="360" y="525" fill="#e9d5ff" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">HALL 4</text>
    <text x="360" y="542" fill="#c084fc" font-size="9" text-anchor="middle">Conference</text>
  </g>

  <!-- Hall 5: Seminar Hall B (Center Corridor Yellow-Green) -->
  <g class="zone-group">
    <rect id="hall-5"
          x="590" y="475" width="55" height="50" rx="6"
          transform="rotate(35 615 500)"
          fill="#3f3c1d" stroke="#facc15" stroke-width="2.5" />
    <text x="615" y="500" fill="#fef08a" font-size="11" font-weight="800" text-anchor="middle">HALL 5</text>
  </g>

  <!-- Hall 6: Hardware Showcase Arena (Bottom Right) -->
  <g class="zone-group">
    <polygon id="hall-6"
             points="700,640 760,640 780,680 720,680"
             fill="#3f2e18" stroke="#fbbf24" stroke-width="2" />
    <text x="740" y="663" fill="#fef3c7" font-size="10" font-weight="700" text-anchor="middle">SHOWCASE</text>
  </g>

  <!-- Food Area / Dining Hall (West Wing Corridor) -->
  <g class="zone-group">
    <polygon id="food-area"
             points="155,100 230,100 230,300 330,460 270,510 155,330"
             fill="#2d241e" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="8,4" />
    <text x="210" y="270" fill="#fed7aa" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">FOOD AREA</text>
    <text x="210" y="290" fill="#fdba74" font-size="9" text-anchor="middle">Dining & Refreshments</text>
  </g>

  <!-- Sponsor Booths (Lower Center) -->
  <g class="zone-group">
    <path id="sponsor-booths"
          d="M 460 520 L 560 520 C 560 550 540 565 510 565 C 480 565 460 550 460 520 Z"
          fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
    <text x="510" y="542" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle">SPONSOR BOOTHS</text>
  </g>

  <!-- Registration & Main Entrance (South Center) -->
  <g class="zone-group">
    <polygon id="registration-entrance"
             points="370,610 450,610 450,660 370,660"
             fill="#18181b" stroke="#e11d48" stroke-width="3" />
    <text x="410" y="632" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">ENTRANCE</text>
    <text x="410" y="648" fill="#fda4af" font-size="9" text-anchor="middle">Registration Desk</text>
    <!-- Entrance pointer arrow -->
    <path d="M 410 700 L 410 670 M 403 678 L 410 670 L 417 678" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- ==================== AMENITY PINS ==================== -->
  <g id="amenities">
    <!-- Restrooms (West) -->
    <g id="amenity-restroom-1">
      <circle cx="280" cy="460" r="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
      <text x="280" y="464" font-size="11" text-anchor="middle" fill="#ffffff">🚻</text>
    </g>

    <!-- Restrooms (East) -->
    <g id="amenity-restroom-2">
      <circle cx="650" cy="450" r="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
      <text x="650" y="454" font-size="11" text-anchor="middle" fill="#ffffff">🚻</text>
    </g>

    <!-- Drinking Water (Northwest) -->
    <g id="amenity-water-1">
      <circle cx="190" cy="210" r="13" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <text x="190" y="214" font-size="11" text-anchor="middle" fill="#ffffff">💧</text>
    </g>

    <!-- Drinking Water (Central) -->
    <g id="amenity-water-2">
      <circle cx="490" cy="505" r="13" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <text x="490" y="509" font-size="11" text-anchor="middle" fill="#ffffff">💧</text>
    </g>

    <!-- Food & Coffee Amenity -->
    <g id="amenity-food-1">
      <circle cx="180" cy="460" r="14" fill="#b45309" stroke="#fbbf24" stroke-width="1.5" />
      <text x="180" y="464" font-size="11" text-anchor="middle" fill="#ffffff">☕</text>
    </g>

    <!-- Helpdesk / Info -->
    <g id="amenity-helpdesk-1">
      <circle cx="340" cy="625" r="13" fill="#047857" stroke="#34d399" stroke-width="1.5" />
      <text x="340" y="629" font-size="11" text-anchor="middle" fill="#ffffff">ℹ️</text>
    </g>
  </g>

  <!-- ==================== WAYPOINTS LAYER (<g id="waypoints">) ==================== -->
  <!-- Used by the wayfinding shortestPath A* engine for nodes & routing -->
  <g id="waypoints" opacity="0.9">
    <!-- Entrance node -->
    <circle id="wp-entrance" cx="410" cy="635" r="5" fill="#f43f5e" />
    
    <!-- Central corridor junction -->
    <circle id="wp-central-hub" cx="420" cy="500" r="5" fill="#38bdf8" />

    <!-- Hall 1 Main Auditorium Entrance Door -->
    <circle id="wp-hall-1" cx="425" cy="460" r="5" fill="#34d399" />

    <!-- Hall 4 Conference Room Door -->
    <circle id="wp-hall-4" cx="370" cy="500" r="5" fill="#a78bfa" />

    <!-- West corridor junction -->
    <circle id="wp-west-junction" cx="300" cy="440" r="5" fill="#38bdf8" />

    <!-- Food Area Waypoint -->
    <circle id="wp-food-area" cx="220" cy="350" r="5" fill="#fb923c" />

    <!-- North Water Waypoint -->
    <circle id="wp-north-hallway" cx="210" cy="180" r="5" fill="#38bdf8" />

    <!-- East Corridor Junction -->
    <circle id="wp-east-hub" cx="540" cy="500" r="5" fill="#38bdf8" />

    <!-- Sponsor Booths Waypoint -->
    <circle id="wp-sponsor-booths" cx="510" cy="540" r="5" fill="#94a3b8" />

    <!-- Hall 5 Seminar Hall B Door -->
    <circle id="wp-hall-5" cx="610" cy="520" r="5" fill="#facc15" />

    <!-- Hall 2 Octagon Arena Door -->
    <circle id="wp-hall-2" cx="650" cy="540" r="5" fill="#34d399" />

    <!-- Hall 3 Computer Lab 1 Door -->
    <circle id="wp-hall-3" cx="740" cy="570" r="5" fill="#22d3ee" />

    <!-- Hardware Showcase Waypoint -->
    <circle id="wp-hall-6" cx="730" cy="640" r="5" fill="#fbbf24" />

    <!-- Stairs / Lifts to Upper Floors -->
    <circle id="wp-stairs-west" cx="330" cy="520" r="5" fill="#c084fc" />
    <circle id="wp-stairs-east" cx="570" cy="490" r="5" fill="#c084fc" />
  </g>
</svg>

